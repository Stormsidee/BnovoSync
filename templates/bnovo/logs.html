{% extends "bnovo/base.html" %}

{% block title %}Логи — Bnovo Sync{% endblock %}

{% block content %}
  <section class="panel">
    <h2>Логи</h2>
    <table>
      <thead>
        <tr>
          <th>Время</th>
          <th>Уровень</th>
          <th>Эндпоинт</th>
          <th>Сообщение</th>
        </tr>
      </thead>
      <tbody>
        {% for log in logs %}
        <tr>
          <td>{{ log.created_at }}</td>
          <td>{{ log.level }}</td>
          <td>{{ log.endpoint }}</td>
          <td>{{ log.message }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="muted">Пока нет логов</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </section>
{% endblock %}
