<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Bnovo Sync{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #0ea5e9;
      --accent-ink: #ffffff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #e0f2fe, var(--bg));
      color: var(--ink);
    }
    .wrap { max-width: 1200px; margin: 28px auto 60px; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; }
    .subtitle { color: var(--muted); font-size: 14px; }
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
    .sidebar {
      position: sticky;
      top: 20px;
      align-self: start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      height: fit-content;
    }
    .nav-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .nav a {
      display: block;
      padding: 8px 10px;
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }
    .nav a:hover { background: #e0f2fe; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }
    .col-3 { grid-column: span 3; }
    .col-12 { grid-column: span 12; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
      color: var(--ink);
    }
    input:focus, select:focus { outline: 2px solid #bae6fd; border-color: #7dd3fc; }
    .actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      font-weight: 600;
    }
    button.danger {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
    }
    button.ghost {
      background: #ffffff;
      color: var(--accent);
    }
    button.secondary { background: #ffffff; color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .muted { color: var(--muted); }
    @media (max-width: 900px) {
      .col-6, .col-4, .col-3 { grid-column: span 12; }
      header { flex-direction: column; align-items: flex-start; gap: 6px; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Bnovo Sync</h1>
        <div class="subtitle">Состояние синхронизации и локальные настройки интеграции.</div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="nav-title">Навигация</div>
        <nav class="nav">
          <a href="{% url 'dashboard' %}">Главная</a>
          <a href="{% url 'endpoints' %}">Эндпоинты</a>
          <a href="{% url 'tokens' %}">Токены</a>
          <a href="{% url 'logs' %}">Логи</a>
        </nav>
      </aside>

      <div>
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
